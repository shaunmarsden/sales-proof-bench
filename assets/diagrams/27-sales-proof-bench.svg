<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title"><title id="title">A fair AI sales comparison</title><style>:root{--i:#183b56;--l:#607080;--b:#dfeaf3;--g:#e8f5ed;--a:#fff4dd;--n:#eef2f6}@media(prefers-color-scheme:dark){:root{--i:#e6edf3;--l:#9baabd;--b:#23364a;--g:#183b2a;--a:#4a3610;--n:#263444}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--i)}.x{stroke:var(--l);stroke-width:3;rx:16}.l{stroke:var(--l);stroke-width:3}.t{font-size:16px;font-weight:700}.s{font-size:13px}</style><g><rect class="x" x="20" y="60" width="150" height="75" fill="var(--b)"/><rect class="x" x="200" y="60" width="150" height="75" fill="var(--b)"/><rect class="x" x="380" y="60" width="150" height="75" fill="var(--n)"/><rect class="x" x="560" y="60" width="150" height="75" fill="var(--g)"/><rect class="x" x="740" y="60" width="150" height="75" fill="var(--a)"/></g><path class="l" fill="none" d="M170 98H200M350 98H380M530 98H560M710 98H740"/><text class="t" x="95" y="92" text-anchor="middle">Same input</text><text class="t" x="275" y="92" text-anchor="middle">Same task</text><text class="t" x="455" y="82" text-anchor="middle">Record model</text><text class="t" x="455" y="103" text-anchor="middle">and setup</text><text class="t" x="635" y="82" text-anchor="middle">Score against</text><text class="t" x="635" y="103" text-anchor="middle">evidence</text><text class="t" x="815" y="82" text-anchor="middle">Show limits</text><text class="t" x="815" y="103" text-anchor="middle">and failures</text></svg>
